<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%" fill="none" role="img" aria-label="Wide Area Communications LLC">
  <defs>
    <linearGradient id="cableGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#02142e" />
      <stop offset="50%" stop-color="#0b254e" />
      <stop offset="100%" stop-color="#0a326c" />
    </linearGradient>
    <linearGradient id="plugGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <linearGradient id="ribGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Network Cable Loop & Connector Icon -->
  <g id="cable-symbol">
    <!-- Upper Cable Tail / S-curve Wave -->
    <path d="M 215 48 C 175 42 145 42 120 48 C 80 57 45 74 32 94 C 20 112 28 128 55 136 C 75 142 105 142 128 142" 
          stroke="url(#cableGrad)" 
          stroke-width="13" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none" />
    
    <!-- Fine upper tail flick -->
    <path d="M 135 44 C 165 40 195 44 220 52" 
          stroke="#0b254e" 
          stroke-width="3" 
          stroke-linecap="round" 
          fill="none" />

    <!-- Cable Connector Boot -->
    <rect x="122" y="126" width="12" height="28" rx="2" fill="#0b254e" />
    
    <!-- Connector Ribs / Pins -->
    <rect x="138" y="123" width="3.5" height="34" rx="1.5" fill="#0284c7" />
    <rect x="145" y="122" width="3.5" height="36" rx="1.5" fill="#0284c7" />
    <rect x="152" y="121" width="3.5" height="38" rx="1.5" fill="#0284c7" />
    <rect x="159" y="121" width="3.5" height="38" rx="1.5" fill="#38bdf8" />
    <rect x="166" y="121" width="3.5" height="38" rx="1.5" fill="#38bdf8" />
    <rect x="173" y="122" width="3.5" height="36" rx="1.5" fill="#38bdf8" />

    <!-- Plug Head Block / Crystal Jack Body -->
    <path d="M 180 122 L 208 124 Q 212 124 212 128 L 212 152 Q 212 156 208 156 L 180 158 Z" fill="url(#plugGrad)" opacity="0.95" />
    <rect x="180" y="124" width="4" height="32" fill="#0284c7" opacity="0.6" />
  </g>

  <!-- Typography -->
  <!-- "Wide Area" in Cyan / Sky Blue -->
  <text x="218" y="152" 
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', sans-serif" 
        font-size="44" 
        font-weight="400" 
        letter-spacing="-0.02em" 
        fill="#38bdf8">Wide Area</text>

  <!-- "Communications" in Deep Navy / Slate -->
  <text x="92" y="188" 
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', sans-serif" 
        font-size="42" 
        font-weight="700" 
        letter-spacing="-0.03em" 
        fill="#0b2240">Communications</text>

  <!-- "LLC" in Clean Secondary Subtext -->
  <text x="424" y="208" 
        font-family="system-ui, -apple-system, 'Inter', sans-serif" 
        font-size="18" 
        font-weight="700" 
        letter-spacing="0.08em" 
        fill="#0b2240">LLC</text>
</svg>
